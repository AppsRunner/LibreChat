version: 1.3.5
cache: true

interface:
  presets: true
  prompts:
    use: true
    create: true
    share: false

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "deepseek/deepseek-r1"
          - "deepseek/deepseek-chat"
          - "anthropic/claude-3.5-sonnet"
          - "google/gemini-2.5-pro"
      fetch: true # Highly recommended: let it fetch your OpenRouter models automatically
      titleConvo: true
      titleModel: "deepseek/deepseek-chat"
      dropParams: ["stop"] # Removed "user" from here
      modelDisplayLabel: "OpenRouter"

fileConfig:
  serverFileSizeLimit: 50
  avatarSizeLimit: 2
